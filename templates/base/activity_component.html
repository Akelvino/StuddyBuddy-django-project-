<h3>Recent Activity</h3>
{% for message in rmessages %}
<div>
    <small>@{{message.user}} {{message.created|timesince}} replied to "{{message.room}}"</small>
    <p>{{message}}</p>
    {% if request.user == message.user %}
    <a href="{% url 'delete-message' message.id %}">Delete</a>
    {% endif %}
    <hr>
</div>
{% endfor %}
