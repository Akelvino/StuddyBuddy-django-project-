{% load static %}
<div class="h-16 flex justify-between items-center mt-3 pb-3">
    <div class="flex justify-center items-center gap-3">
        <a href="{% url 'home' %}" class="cursor-pointer"><img class="h-[3.2rem] w-[3.2rem]" src="{% static 'images/logo.svg' %}" alt=""></a>
        <h1 class="text-light text-[2rem] font-bold">StudyBud</h1>
        <div  class="bg-dark-medium px-[1.3rem] py-4 rounded-[4px] flex items-center justify-start gap-4 ml-4 w-[30rem] outline-none border-none">
            <div class="flex ">
                <i class="ri-search-line w-8 h-8 ml-1"></i>
                <form action="{% url 'home' %}">
                    <input class="w-[30rem] outline-none border-none" type="text" name="q" placeholder="search Rooms...">
                </form>
            </div>
        </div>
    </div>
    
    <div class="">
        {% if request.user.is_authenticated %}
            <p>Hello, {{ request.user }}</p>
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <div class="flex  items-center justify-center gap-5 mr-10 ">
                <img src="{% static 'images/avatar.svg' %}" alt="">
                <a href="{% url 'login' %}">Login</a>
            </div>
        {% endif %}
    </div>
</div>
<hr class="mb-10">
